    <style>
        :root {
            --bg-deep: #030407;
            --bg-secondary: #090A12;
            --bg-card: #0C0D18;
            --bg-sidebar: #06060F;
            --bg-hover: #11131e;
            --accent: #8B5CF6;
            --accent-bright: #A78BFA;
            --accent-deep: #6D28D9;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --accent-glow-soft: rgba(139, 92, 246, 0.15);
            --gold: #F3C64B;
            --gold-deep: #C97A10;
            --text: #FFFFFF;
            --text-secondary: #C5C7D0;
            --text-muted: #7B7F8C;
            --border: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 255, 255, 0.12);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.7);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-display: 'Unbounded', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
            --sidebar-width: 260px;
            --header-height: 58px;
            --max-width: 100vw;
            --card-min-width: 160px;
            --card-gap: clamp(8px, 1.4vw, 16px);
            --section-padding: clamp(8px, 2vw, 24px);
            --content-padding-bottom: clamp(60px, 8vw, 90px);
            --grid-cols-mobile: 2;
            --grid-cols-tablet: 3;
            --grid-cols-desktop: 4;
            --grid-cols-wide: 5;
            --grid-cols-ultra: 6;
            --hero-height-mobile: clamp(200px, 42vh, 320px);
            --hero-height-desktop: clamp(300px, 46vh, 480px);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            height: 100%;
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }
        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-overflow-scrolling: touch;
            position: relative;
            max-width: 100vw;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(1400px 700px at 5% -8%, rgba(139, 92, 246, 0.06), transparent 55%),

                radial-gradient(800px 400px at 50% 80%, rgba(139, 92, 246, 0.03), transparent 60%);
        }
        #app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            flex: 1;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* Loading Splash */
        #loadingSplash {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #030407 0%, #0a0a1e 30%, #050510 60%, #020208 100%);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            visibility: visible;
        }
        #loadingSplash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-bg-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(120px);
            animation: orbFloat 8s ease-in-out infinite;
        }
        .splash-bg-orb.orb1 {
            width: 260px;
            height: 260px;
            background: rgba(139, 92, 246, 0.2);
            top: -8%;
            left: -12%;
            animation-delay: 0s;
        }
        .splash-bg-orb.orb2 {
            width: 220px;
            height: 220px;
            background: rgba(243, 198, 75, 0.12);
            bottom: -6%;
            right: -10%;
            animation-delay: -4s;
            animation-duration: 10s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -25px) scale(1.1); }
            50% { transform: translate(-15px, 15px) scale(0.92); }
            75% { transform: translate(20px, 8px) scale(1.05); }
        }
        .splash-logo-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .splash-logo-ring {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .splash-logo-ring svg {
            position: absolute;
            width: 120px;
            height: 120px;
            animation: logoRingRotate 12s linear infinite;
        }
        .splash-logo-ring svg circle {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-dasharray: 60 340;
            stroke-linecap: round;
            animation: dashAnim 3s ease-in-out infinite;
        }
        @keyframes logoRingRotate { to { transform: rotate(360deg); } }
        @keyframes dashAnim {
            0%, 100% { stroke-dasharray: 60 340; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 180 220; stroke-dashoffset: -30; }
        }
        .splash-logo-ring img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 1;
            animation: splashLogoPulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.45), 0 0 80px rgba(139, 92, 246, 0.18);
        }
        @keyframes splashLogoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.45), 0 0 80px rgba(139, 92, 246, 0.18); }
            50% { transform: scale(1.06); box-shadow: 0 0 55px rgba(139, 92, 246, 0.6), 0 0 110px rgba(139, 92, 246, 0.28); }
        }
        .splash-progress-wrap {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
            z-index: 2;
        }
        .splash-progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--gold), var(--accent));
            background-size: 300% 100%;
            animation: progressFill 2.5s ease-in-out forwards, shimmerBar 2s linear infinite;
            width: 0%;
        }
        @keyframes progressFill {
            0% { width: 0%; }
            30% { width: 35%; }
            60% { width: 65%; }
            85% { width: 90%; }
            100% { width: 100%; }
        }
        @keyframes shimmerBar {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .splash-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #f3c64b 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: splashTextShimmer 3s ease-in-out infinite;
            letter-spacing: 0.3px;
            z-index: 2;
            text-align: center;
        }
        .splash-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
            z-index: 2;
            letter-spacing: 0.4px;
            font-weight: 400;
        }
        @keyframes splashTextShimmer {
            0%, 100% { background-position: 0% 50%; opacity: 0.8; }
            50% { background-position: 100% 50%; opacity: 1; }
        }
        .splash-dots {
            display: flex;
            gap: 6px;
            margin-top: 28px;
            z-index: 2;
        }
        .splash-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .splash-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--accent-bright); }
        .splash-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--gold); }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-8px); opacity: 1; }
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            height: 100dvh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-smooth);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            max-width: 80vw;
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
            display: none;
            backdrop-filter: blur(4px);

        .sidebar-backdrop.active { display: block; }
        .sidebar-logo {
            padding: 16px 20px;

            align-items: center;
            gap: 10px;

            flex-shrink: 0;
            transition: background var(--transition-fast);

        .sidebar-logo img {
            height: 34px;

        .sidebar-logo span {

        .sidebar-nav {
            flex: 1;

        .sidebar-nav .nav-item {

            background: var(--glass-strong);

        .sidebar-footer {

        .main-area {
            flex: 1;
            margin-left: var(--sidebar-width);
