<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GitHub File Manager</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 10% 0%,#243b72 0%,transparent 35%),
        radial-gradient(circle at 90% 100%,#32194f 0%,transparent 35%),
        #070a12;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:390px;
    padding:35px 28px;
    text-align:center;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border-radius:25px;
    box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:34px;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.loginBox h1{
    font-size:25px;
    margin-bottom:8px;
}

.loginBox p{
    color:#8e98ad;
    font-size:13px;
    margin-bottom:25px;
}

.password{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    outline:none;
    background:rgba(0,0,0,.25);
    color:#fff;
    text-align:center;
    font-size:20px;
    letter-spacing:6px;
}

.loginBtn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.loginBtn:active{
    transform:scale(.98);
}

.error{
    display:none;
    margin-top:14px;
    color:#ff6b81;
    font-size:13px;
}

/* APP */

#app{
    display:none;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,15,.82);
    backdrop-filter:blur(18px);
}

.headerInner{
    max-width:1100px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandIcon{
    width:44px;
    height:44px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.brand h2{
    font-size:18px;
}

.brand small{
    display:block;
    color:#8992a6;
    margin-top:3px;
    font-size:11px;
}

.logout{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:24px 20px 50px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search{
    flex:1;
    min-width:0;
    padding:14px 16px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    color:#fff;
    background:rgba(255,255,255,.05);
}

.search:focus{
    border-color:#667eea;
}

.copyAll{
    padding:0 17px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#11998e,#38ef7d);
    color:#04110c;
    font-weight:700;
    cursor:pointer;
}

.path{
    padding:13px 15px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:rgba(255,255,255,.04);
    color:#aab2c3;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.path span{
    color:#fff;
}

.back{
    display:none;
    margin-bottom:15px;
    padding:10px 14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(255,255,255,.05);
    color:#fff;
    cursor:pointer;
}

.files{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:15px;
}

.card{
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:17px;
    background:rgba(255,255,255,.045);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:rgba(102,126,234,.45);
}

.top{
    display:flex;
    align-items:center;
    gap:13px;
}

.icon{
    width:48px;
    height:48px;
    flex-shrink:0;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    background:rgba(102,126,234,.14);
}

.name{
    font-size:14px;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.type{
    margin-top:4px;
    color:#8992a6;
    font-size:11px;
}

.link{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    background:rgba(0,0,0,.2);
    color:#8f99ae;
    font-size:10px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:11px;
}

.btn{
    flex:1;
    padding:10px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.open{
    background:rgba(102,126,234,.18);
    color:#aab8ff;
}

.copy{
    background:rgba(56,239,125,.12);
    color:#54ed94;
}

.folderBtn{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:0;
    border-radius:10px;
    background:rgba(255,193,7,.12);
    color:#ffd45c;
    cursor:pointer;
    font-weight:600;
}

.status{
    text-align:center;
    padding:55px 15px;
    color:#8b95aa;
}

footer{
    text-align:center;
    color:#596276;
    font-size:11px;
    padding:20px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:12px 18px;
    border-radius:12px;
    background:#181d2b;
    border:1px solid rgba(255,255,255,.1);
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:600px){

    .container{
        padding:18px 13px 40px;
    }

    .toolbar{
        flex-direction:column;
    }

    .copyAll{
        padding:13px;
    }

    .files{
        grid-template-columns:1fr;
    }

    .headerInner{
        padding:13px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="loginBox">

        <div class="logo">🔐</div>

        <h1>File Manager</h1>

        <p>Enter password to continue</p>

        <input
            id="password"
            class="password"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
            autocomplete="off"
        >

        <button class="loginBtn" onclick="login()">
            🔓 LOGIN
        </button>

        <div id="error" class="error">
            ❌ Wrong password
        </div>

    </div>

</div>


<!-- APP -->

<div id="app">

<header>

    <div class="headerInner">

        <div class="brand">

            <div class="brandIcon">📁</div>

            <div>
                <h2>GitHub Files</h2>
                <small>File Manager</small>
            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            placeholder="🔎 Search files..."
            oninput="searchFiles()"
        >

        <button
            class="copyAll"
            onclick="copyAllLinks()"
        >
            📋 Copy All
        </button>

    </div>


    <div class="path">
        📍 Path:
        <span id="currentPath">/</span>
    </div>


    <button
        id="backBtn"
        class="back"
        onclick="goBack()"
    >
        ← Back
    </button>


    <div id="files" class="files">

        <div class="status">
            ⏳ Loading GitHub files...
        </div>

    </div>

</div>


<footer>
    GitHub File Manager
</footer>

</div>


<div id="toast" class="toast">
    Copied
</div>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

/*
   CHANGE THESE TWO VALUES
*/

const GITHUB_USER = "0ashalive";

const GITHUB_REPO = "allplaylist";


/*
   Optional:
   If your files are inside a GitHub folder,
   put folder path here.

   Example:
   const ROOT_FOLDER = "upload";

   For repository root:
*/
const ROOT_FOLDER = "";


/*
   Branch
*/
const GITHUB_BRANCH = "main";


/*
   LOGIN PASSWORD
*/
const PASSWORD = "2580";


/* =====================================================
   VARIABLES
   ===================================================== */

let currentPath = ROOT_FOLDER;

let allItems = [];


/* =====================================================
   LOGIN
   ===================================================== */

function login(){

    const value =
        document.getElementById("password").value;

    if(value === PASSWORD){

        sessionStorage.setItem(
            "github_file_login",
            "yes"
        );

        showApp();

    }else{

        document.getElementById("error").style.display =
            "block";

        document.getElementById("password").value = "";

    }

}


document
.getElementById("password")
.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        login();
    }

});


/* =====================================================
   SESSION
   ===================================================== */

function showApp(){

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("app").style.display =
        "block";

    loadFiles();

}


function logout(){

    sessionStorage.removeItem(
        "github_file_login"
    );

    location.reload();

}


if(
    sessionStorage.getItem(
        "github_file_login"
    ) === "yes"
){

    showApp();

}


/* =====================================================
   GITHUB API
   ===================================================== */

async function loadFiles(){

    const container =
        document.getElementById("files");

    container.innerHTML = `
        <div class="status">
            ⏳ Loading...
        </div>
    `;


    document.getElementById("currentPath").textContent =
        "/" + (currentPath || "");


    let apiUrl =
        "https://api.github.com/repos/" +
        encodeURIComponent(GITHUB_USER) +
        "/" +
        encodeURIComponent(GITHUB_REPO) +
        "/contents/";


    if(currentPath){

        apiUrl +=
            currentPath
            .split("/")
            .map(encodeURIComponent)
            .join("/");

    }


    apiUrl +=
        "?ref=" +
        encodeURIComponent(GITHUB_BRANCH);


    try{

        const response =
            await fetch(apiUrl,{

                headers:{
                    "Accept":
                    "application/vnd.github+json"
                }

            });


        if(!response.ok){

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                data.message ||
                "Invalid GitHub response"
            );

        }


        allItems = data;

        renderFiles(data);


    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="status">

                ❌ Failed to load files

                <br><br>

                <small>
                    ${escapeHtml(error.message)}
                </small>

                <br><br>

                Check:
                <br>
                • GitHub username
                <br>
                • Repository name
                <br>
                • Branch name
                <br>
                • Repository is public
                <br>
                • GitHub API rate limit

            </div>
        `;

    }

}


/* =====================================================
   RENDER FILES
   ===================================================== */

function renderFiles(items){

    const container =
        document.getElementById("files");


    if(items.length === 0){

        container.innerHTML = `
            <div class="status">
                📂 This folder is empty
            </div>
        `;

        return;

    }


    /*
       Folders first
    */

    items.sort((a,b)=>{

        if(a.type === b.type) return a.name.localeCompare(b.name);

        return a.type === "dir" ? -1 : 1;

    });


    container.innerHTML =
        items.map((item,index)=>{

            if(item.type === "dir"){

                return folderCard(item,index);

            }

            return fileCard(item,index);

        }).join("");

}


/* =====================================================
   FOLDER CARD
   ===================================================== */

function folderCard(item,index){

    return `

        <div class="card">

            <div class="top">

                <div class="icon">
                    📁
                </div>

                <div>

                    <div class="name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="type">
                        FOLDER
                    </div>

                </div>

            </div>


            <button
                class="folderBtn"
                onclick="openFolder(${index})"
            >
                📂 Open Folder
            </button>

        </div>

    `;

}


/* =====================================================
   FILE CARD
   ===================================================== */

function fileCard(item,index){

    const rawUrl =
        "https://raw.githubusercontent.com/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/" +
        GITHUB_BRANCH +
        "/" +
        item.path;


    const githubUrl =
        "https://github.com/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/blob/" +
        GITHUB_BRANCH +
        "/" +
        item.path;


    const extension =
        item.name.includes(".")
        ? item.name.split(".").pop().toUpperCase()
        : "FILE";


    return `

        <div
            class="card file-card"
            data-search="${escapeHtml(
                item.name.toLowerCase()
            )}"
        >

            <div class="top">

                <div class="icon">
                    ${getIcon(item.name)}
                </div>

                <div>

                    <div class="name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="type">
                        ${extension}
                    </div>

                </div>

            </div>


            <div class="link">
                ${escapeHtml(rawUrl)}
            </div>


            <div class="buttons">

                <button
                    class="btn open"
                    onclick="openUrl('${escapeAttr(rawUrl)}')"
                >
                    ↗ Open
                </button>

                <button
                    class="btn copy"
                    onclick="copyText('${escapeAttr(rawUrl)}')"
                >
                    📋 Copy
                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   OPEN FOLDER
   ===================================================== */

function openFolder(index){

    const folders =
        [...allItems]
        .filter(item => item.type === "dir");

    const folder =
        folders[index];

    if(!folder) return;

    currentPath =
        folder.path;

    document.getElementById("search").value =
        "";

    loadFiles();

    document.getElementById("backBtn").style.display =
        currentPath
        ? "block"
        : "none";

}


/* =====================================================
   BACK
   ===================================================== */

function goBack(){

    if(!currentPath){

        return;

    }


    const parts =
        currentPath
        .split("/")
        .filter(Boolean);


    /*
       Do not go above ROOT_FOLDER
    */

    const rootParts =
        ROOT_FOLDER
        .split("/")
        .filter(Boolean);


    if(parts.length <= rootParts.length){

        currentPath =
            ROOT_FOLDER;

    }else{

        parts.pop();

        currentPath =
            parts.join("/");

    }


    document.getElementById("search").value =
        "";

    loadFiles();


    document.getElementById("backBtn").style.display =
        currentPath
        ? "block"
        : "none";

}


/* =====================================================
   SEARCH
   ===================================================== */

function searchFiles(){

    const q =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if(!q){

        renderFiles(allItems);

        return;

    }


    const filtered =
        allItems.filter(item =>
            item.name
            .toLowerCase()
            .includes(q)
        );


    renderFiles(filtered);

}


/* =====================================================
   COPY SINGLE
   ===================================================== */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

        toast("✅ Link copied");

    }catch(e){

        fallbackCopy(text);

    }

}


/* =====================================================
   COPY ALL
   ===================================================== */

async function copyAllLinks(){

    const files =
        allItems.filter(
            item => item.type === "file"
        );


    if(files.length === 0){

        toast("No files");

        return;

    }


    const links =
        files.map(item =>

            "https://raw.githubusercontent.com/" +
            GITHUB_USER +
            "/" +
            GITHUB_REPO +
            "/" +
            GITHUB_BRANCH +
            "/" +
            item.path

        ).join("\n");


    await copyText(links);

}


/* =====================================================
   OPEN
   ===================================================== */

function openUrl(url){

    window.open(
        url,
        "_blank",
        "noopener"
    );

}


/* =====================================================
   ICON
   ===================================================== */

function getIcon(name){

    const ext =
        name
        .split(".")
        .pop()
        .toLowerCase();


    if(ext === "json") return "📋";

    if(ext === "m3u" ||
       ext === "m3u8") return "📺";

    if(ext === "txt") return "📄";

    if(ext === "html" ||
       ext === "htm") return "🌐";

    if(ext === "php") return "🐘";

    if(ext === "js") return "⚙️";

    if(ext === "css") return "🎨";

    if(
        ext === "jpg" ||
        ext === "jpeg" ||
        ext === "png" ||
        ext === "webp" ||
        ext === "gif"
    ) return "🖼️";

    if(
        ext === "mp4" ||
        ext === "mkv" ||
        ext === "avi"
    ) return "🎬";

    return "📄";

}


/* =====================================================
   TOAST
   ===================================================== */

function toast(message){

    const t =
        document.getElementById("toast");

    t.textContent =
        message;

    t.classList.add("show");


    setTimeout(()=>{

        t.classList.remove("show");

    },1800);

}


/* ===========================
